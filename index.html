<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/orange-icon.svg" />
    <link rel="apple-touch-icon" href="/orange-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdfdfc" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem("orange-app:theme"); } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#1b1c1a" : "#fdfdfc");
      })();
    </script>
    <title>Orange &mdash; Ticket triage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
